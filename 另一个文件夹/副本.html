<meta charset="UTF-8">
<title>随机抽人（网页版）</title>
<style>
  :root {
    --bg-0: #0b1220;
    --bg-1: #16233b;
    --panel: rgba(255, 255, 255, .045);
    --panel-line: rgba(255, 255, 255, .10);
    --text: #e8eefc;
    --text-dim: #93a4c4;
    --accent: #f5b301;
    --accent-soft: rgba(245, 179, 1, .14);
    --blue: #4c8dff;
    --green: #34d399;
    --red: #f87171;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
    background: radial-gradient(1200px 700px at 22% -10%, #1d3255 0%, var(--bg-1) 42%, var(--bg-0) 100%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--text);
    border-radius: 9px;
    padding: 8px 14px;
    font-size: 13.5px;
    transition: background .15s, border-color .15s, transform .08s, opacity .15s;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.22); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary {
    background: linear-gradient(180deg, #ffc93c, #f0a500);
    color: #2a1c00; border-color: #f0a500; font-weight: 700;
  }
  button.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ffd45c, #ffb200); }
  button.danger { color: var(--red); border-color: rgba(248,113,113,.35); }
  button.danger:hover:not(:disabled) { background: rgba(248,113,113,.14); }
  button.ghost { background: transparent; }
  button.tiny { padding: 4px 9px; font-size: 12px; border-radius: 7px; }

  input[type=text], select {
    font-family: inherit; font-size: 13px;
    background: rgba(0,0,0,.28); color: var(--text);
    border: 1px solid var(--panel-line); border-radius: 7px;
    padding: 6px 9px; width: 100%;
  }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--blue); background: rgba(0,0,0,.42); }

  /* ---------------------------------------------------------- 顶栏 */
  .toolbar {
    display: flex; align-items: center; gap: 18px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--panel-line);
    background: rgba(8, 14, 26, .58);
    backdrop-filter: blur(10px);
    flex-wrap: wrap;
  }
  .brand { font-size: 16px; font-weight: 700; letter-spacing: .12em; color: var(--accent); white-space: nowrap; }

  .tabs { display: flex; gap: 4px; background: rgba(0,0,0,.26); padding: 3px; border-radius: 10px; }
  .tabs button { border: none; background: transparent; padding: 6px 15px; border-radius: 8px; color: var(--text-dim); }
  .tabs button.active { background: rgba(255,255,255,.12); color: var(--text); font-weight: 600; }

  .counters { display: flex; gap: 22px; margin-left: auto; align-items: center; }
  .counter { text-align: center; line-height: 1.25; }
  .counter b { display: block; font-size: 21px; font-variant-numeric: tabular-nums; }
  .counter span { font-size: 11px; color: var(--text-dim); letter-spacing: .06em; }
  .counter.hl b { color: var(--accent); }

  .progress { width: 130px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f5b301, #ffd66b); transition: width .35s ease; }

  .toggle { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; white-space: nowrap; }
  .toggle input { accent-color: var(--accent); cursor: pointer; }

  /* ---------------------------------------------------------- 布局 */
  main { height: calc(100% - 61px); }
  .view { height: 100%; }
  /* 两个视图用 ID 选择器设了 display（优先级 1,0,0），会压过 .view[hidden]（0,2,0），
     导致 hidden 属性对 display 失效、页面切不动、名单页被挤到视口外面。
     必须用同等级或更高的选择器，删掉这几行会让「名单管理」整页点不到。 */
  .view[hidden],
  #view-draw[hidden],
  #view-roster[hidden] { display: none; }

  #view-draw { display: grid; grid-template-columns: 1fr 330px; }

  /* ---------------------------------------------------------- 抽取台 */
  .stage {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 32px; gap: 8px; position: relative; text-align: center;
  }
  .stage::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(560px 300px at 50% 44%, rgba(76,141,255,.13), transparent 72%);
    pointer-events: none;
  }

  .hint { font-size: 13.5px; color: var(--text-dim); letter-spacing: .05em; min-height: 20px; }

  .name {
    font-size: clamp(56px, 11vw, 148px);
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: .03em;
    color: #fff;
    text-shadow: 0 6px 34px rgba(0,0,0,.55);
    transition: color .18s, transform .18s;
    word-break: break-all;
  }
  .name.idle { color: var(--text-dim); font-size: clamp(30px, 4.4vw, 54px); font-weight: 600; }
  .name.rolling { color: #b9cdf0; filter: blur(.6px); }
  .name.revealed {
    color: var(--accent);
    animation: pop .5s cubic-bezier(.2, 1.5, .4, 1);
    text-shadow: 0 0 46px rgba(245,179,1,.42), 0 6px 34px rgba(0,0,0,.55);
  }
  @keyframes pop {
    0%   { transform: scale(.62); opacity: .2; }
    55%  { transform: scale(1.09); }
    100% { transform: scale(1); opacity: 1; }
  }

  .meta { font-size: 16px; color: var(--text-dim); letter-spacing: .1em; min-height: 22px; font-variant-numeric: tabular-nums; }

  .draw-btn {
    margin-top: 22px;
    font-size: 25px; font-weight: 800; letter-spacing: .3em;
    padding: 17px 62px 17px 66px;
    border: none; border-radius: 16px;
    background: linear-gradient(180deg, #ffc93c, #eda200);
    color: #2a1c00;
    box-shadow: 0 12px 34px rgba(240,166,0,.34);
  }
  .draw-btn:hover:not(:disabled) { background: linear-gradient(180deg, #ffd75f, #ffb400); box-shadow: 0 14px 40px rgba(240,166,0,.46); }
  .draw-btn:disabled { background: rgba(255,255,255,.10); color: var(--text-dim); box-shadow: none; }

  /* ---------------------------------------------------------- 历史 */
  .history {
    border-left: 1px solid var(--panel-line);
    background: rgba(0,0,0,.20);
    display: flex; flex-direction: column; min-height: 0;
  }
  .history-head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 15px; border-bottom: 1px solid var(--panel-line);
  }
  .history-head h2 { font-size: 13.5px; letter-spacing: .1em; color: var(--text-dim); font-weight: 600; }
  .history-head select { width: auto; margin-left: auto; font-size: 12px; padding: 4px 7px; }

  .history-list { list-style: none; overflow-y: auto; flex: 1; padding: 8px; }
  .history-list::-webkit-scrollbar { width: 8px; }
  .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

  .hitem {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 11px; border-radius: 10px; margin-bottom: 5px;
    background: var(--panel); border: 1px solid transparent;
    animation: slidein .3s ease;
  }
  @keyframes slidein { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  .hitem.newest { border-color: rgba(245,179,1,.42); background: var(--accent-soft); }
  .hseq {
    flex: none; width: 25px; height: 25px; border-radius: 7px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.10); font-size: 11.5px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .hmain { min-width: 0; flex: 1; }
  .hname { font-size: 15px; font-weight: 600; }
  .hsub { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .empty-note { padding: 30px 16px; text-align: center; color: var(--text-dim); font-size: 13px; line-height: 1.9; }

  /* ---------------------------------------------------------- 名单管理 */
  #view-roster { display: flex; flex-direction: column; padding: 16px 20px; gap: 12px; min-height: 0; }
  .roster-bar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .roster-bar input[type=text] { width: 190px; }
  .roster-bar .spacer { margin-left: auto; }

  .table-wrap { flex: 1; overflow: auto; border: 1px solid var(--panel-line); border-radius: var(--radius); background: rgba(0,0,0,.18); min-height: 0; }
  .table-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
  .table-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 5px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: #1b2942; color: var(--text-dim);
    font-weight: 600; font-size: 11.5px; letter-spacing: .08em;
    text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--panel-line);
    white-space: nowrap;
  }
  tbody td { padding: 4px 12px; border-bottom: 1px solid rgba(255,255,255,.05); }
  tbody tr:hover { background: rgba(255,255,255,.035); }
  tbody input[type=text] { background: transparent; border-color: transparent; padding: 5px 7px; }
  tbody input[type=text]:hover { border-color: var(--panel-line); }

  .modal textarea {

  }
  .modal textarea:focus { outline: none; border-color: var(--blue); }
  .modal-ops { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }

  .toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast {

  .toast.err { border-left-color: var(--red); }
  @keyframes toastin { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>

<script>
"use strict";

/* ================================================================
   后端调用适配层。
   pywebview 走 JS 桥；HTTP 外壳走 fetch；
   网页版由 gen_html.py 把 BEGIN/END 之间的内容整体换成纯 JS 实现。

   注意：pywebview 6.x 会用内置 HTTP 服务加载本地 HTML，
   所以 location.protocol 是 http:，不能据此判断外壳类型，
   必须靠 pywebviewready 事件或实际探测。
   ================================================================ */
/* ================================================================
   网页版后端：纯 JS 实现，数据存在浏览器 localStorage。
   语义与 Python 版 core.py 完全一致，便于两种版本行为一致。

   由 gen_html.py 注入到 index.html 的 BEGIN/END ADAPTER 之间。
   localStorage 不可用时（例如隐私模式）自动退回内存存储，
   保证功能可用，只是关闭页面后不留存。
   ================================================================ */
let SHELL = "standalone";

async function resolveShell() { return (SHELL = "standalone"); }

/* ---------------------------------------------------------- 存储 */

const STORE_KEY = "随机抽人.v1";

const store = (() => {
  let memory = null;
  function available() {
    try {
      const k = "__t__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }
  const ok = available();
  return {
    persistent: ok,
    read() {
      if (!ok) return memory;
      try {
        const raw = window.localStorage.getItem(STORE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    },
    write(data) {
      if (!ok) { memory = data; return; }
      try {
        window.localStorage.setItem(STORE_KEY, JSON.stringify(data));
      } catch (e) {
        memory = data;      // 配额满时退回内存，避免直接报错丢失操作
      }
    },
  };
})();

/* ---------------------------------------------------------- 工具 */

function nowStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
         `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

/** 无模偏差的随机下标（拒绝采样），与 Python 版 secrets.choice 同义。 */
function randomIndex(n) {
  if (n <= 0) return -1;
  const limit = Math.floor(4294967296 / n) * n;
  const buf = new Uint32Array(1);
  let v;
  do {
    (window.crypto || window.msCrypto).getRandomValues(buf);
    v = buf[0];
  } while (v >= limit);
  return v % n;
}

function emptyState() {
  return {
    students: [],
    draws: [],
    round: 1,
    nextStudentId: 1,
    nextDrawId: 1,
  };
}

let DB = store.read() || emptyState();
let inited = false;

function save() { store.write(DB); }

/** 首次打开时载入内置名单，让网页版开箱即用。 */
function seedIfNeeded() {
  if (inited) return;
  inited = true;
  if (DB.students.length) return;
  const seed = window.__SEED_ROSTER__;
  if (Array.isArray(seed) && seed.length) {
    for (const r of seed) addStudentRaw(r[0], r[1] || "", r[2] || "");
    save();
  }
}

/* ---------------------------------------------------------- 查询 */

function stats() {
  const total = DB.students.length;
  const enabled = DB.students.filter((s) => s.enabled).length;
  const remaining = DB.students.filter((s) => s.enabled && !s.drawn).length;
  return {
    total,
    enabled,
    remaining,
    drawn: enabled - remaining,
    disabled: total - enabled,
    round: DB.round,
  };
}

function poolNames() {
  return DB.students.filter((s) => s.enabled && !s.drawn).map((s) => s.name);
}

function history(round) {
  const rows = round == null ? DB.draws.slice() : DB.draws.filter((d) => d.round === round);
  rows.sort((a, b) => (round == null
    ? (b.round - a.round) || (a.seq - b.seq)
    : a.seq - b.seq));
  // 必须与 Python 接口同形（snake_case），界面按 h.drawn_at / h.student_id 读取
  return rows.map((d) => ({
    id: d.id,
    student_id: d.studentId,
    seq: d.seq,
    round: d.round,
    drawn_at: d.drawnAt,
    name: d.name,
    sid: d.sid,
    cls: d.cls,
  }));
}

function allRounds() {
  return [...new Set(DB.draws.map((d) => d.round))].sort((a, b) => b - a);
}

function listStudents() {
  return DB.students
    .slice()
    .sort((a, b) =>
      (a.cls || "").localeCompare(b.cls || "", "zh") ||
      (a.sid || "").localeCompare(b.sid || "", "zh") ||
      a.id - b.id)
    .map((s) => ({
      id: s.id, name: s.name, sid: s.sid, cls: s.cls,
      enabled: s.enabled ? 1 : 0, drawn: s.drawn ? 1 : 0, drawn_at: s.drawnAt,
    }));
}

/* ---------------------------------------------------------- 抽取 */

function draw() {
  const pool = DB.students.filter((s) => s.enabled && !s.drawn);
  if (!pool.length) return null;

  const picked = pool[randomIndex(pool.length)];
  const seq = DB.draws.filter((d) => d.round === DB.round)
                     .reduce((m, d) => Math.max(m, d.seq), 0) + 1;
  const stamp = nowStr();

  DB.draws.push({
    id: DB.nextDrawId++,
    studentId: picked.id,
    seq,
    round: DB.round,
    drawnAt: stamp,
    name: picked.name,
    sid: picked.sid,
    cls: picked.cls,
  });
  picked.drawn = true;
  picked.drawnAt = stamp;
  save();

  return {
    draw_id: DB.draws[DB.draws.length - 1].id,
    student_id: picked.id,
    seq,
    round: DB.round,
    name: picked.name,
    sid: picked.sid,
    cls: picked.cls,
    drawn_at: stamp,
    remaining: stats().remaining,
  };
}

function renumberRound(round) {
  const rows = DB.draws.filter((d) => d.round === round)
                       .sort((a, b) => a.drawnAt.localeCompare(b.drawnAt) || a.id - b.id);
  rows.forEach((d, i) => { d.seq = i + 1; });
}

function undo(drawId) {
  const idx = DB.draws.findIndex((d) => d.id === Number(drawId));
  if (idx < 0) throw new Error("该抽取记录已不存在");

  const row = DB.draws[idx];
  DB.draws.splice(idx, 1);

  let restored = false;
  if (row.studentId != null) {
    const st = DB.students.find((s) => s.id === row.studentId);
    if (st && st.enabled) {
      st.drawn = false;
      st.drawnAt = null;
      restored = true;
    }
  }
  renumberRound(row.round);
  save();
  return { name: row.name, restored, remaining: stats().remaining };
}

function resetRound() {
  const prev = DB.round;
  let restored = 0;
  for (const s of DB.students) {
    if (s.drawn) { s.drawn = false; s.drawnAt = null; restored++; }
  }
  DB.round = prev + 1;
  save();
  return { prev_round: prev, new_round: DB.round, restored };
}

/* ---------------------------------------------------------- 名单维护 */

function addStudentRaw(name, sid, cls) {
  DB.students.push({
    id: DB.nextStudentId++,
    name: String(name).trim(),
    sid: String(sid || "").trim(),
    cls: String(cls || "").trim(),
    enabled: true,
    drawn: false,
    drawnAt: null,
    createdAt: nowStr(),
  });
}

function addStudent(name, sid, cls) {
  if (!String(name || "").trim()) throw new Error("姓名不能为空");
  addStudentRaw(name, sid, cls);
  save();
  return { name: String(name).trim() };
}

function updateStudent(studentId, field, value) {
  if (!["name", "sid", "cls"].includes(field)) throw new Error("不支持的字段：" + field);
  const st = DB.students.find((s) => s.id === Number(studentId));
  if (!st) throw new Error("该学生已不存在");
  if (field === "name" && !String(value || "").trim()) throw new Error("姓名不能为空");
  st[field] = String(value || "").trim();
  save();
  return { updated: 1 };
}

function setEnabled(studentId, enabled) {
  const st = DB.students.find((s) => s.id === Number(studentId));
  if (!st) throw new Error("该学生已不存在");
  st.enabled = !!enabled;
  save();
  return { updated: 1 };
}

function deleteStudent(studentId) {
  const idx = DB.students.findIndex((s) => s.id === Number(studentId));
  if (idx < 0) throw new Error("该学生已不存在");
  const name = DB.students[idx].name;
  DB.students.splice(idx, 1);
  // 历史记录保留姓名快照，仅断开引用
  for (const d of DB.draws) {
    if (d.studentId === Number(studentId)) d.studentId = null;
  }
  save();
  return { name };
}

function clearStudents() {
  const n = DB.students.length;
  DB.students = [];
  for (const d of DB.draws) d.studentId = null;
  save();
  return { deleted: n };
}

/* ---------------------------------------------------------- CSV 解析 */

const NUMBERING = /^\s*\d+\s*[.、,，)）:：]\s*/;
const HEADER_ALIASES = {
  name: ["姓名", "名字", "学生", "学生姓名", "name"],
  sid: ["学号", "编号", "学籍号", "考号", "sid", "id"],
  cls: ["班级", "班", "行政班", "组别", "分组", "组", "class"],
};

function decodeBytes(buf) {
  const bytes = new Uint8Array(buf);
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    return new TextDecoder("utf-8").decode(bytes.subarray(3));
  }
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  } catch (e) {
    // 中文 Excel 另存的 CSV 通常是 GBK
    try { return new TextDecoder("gbk").decode(bytes); } catch (e2) { /* 继续 */ }
    return new TextDecoder("utf-8").decode(bytes);
  }
}

function sniffDelimiter(line) {
  const counts = [[",", (line.match(/,/g) || []).length],
                  ["\t", (line.match(/\t/g) || []).length],
                  [";", (line.match(/;/g) || []).length]];
  counts.sort((a, b) => b[1] - a[1]);
  return counts[0][1] > 0 ? counts[0][0] : ",";
}

/** 单行 CSV 解析，支持双引号包裹与转义。 */
function parseCsvLine(line, delim) {
  const out = [];
  let cur = "", quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quoted) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else quoted = false;
      } else cur += c;
    } else if (c === '"') {
      quoted = true;
    } else if (c === delim) {
      out.push(cur); cur = "";
    } else cur += c;
  }
  out.push(cur);
  return out;
}

function mapHeader(cells) {
  const map = {};
  cells.forEach((cell, idx) => {
    const token = String(cell).trim().toLowerCase().replace(/\s/g, "");
    for (const [field, aliases] of Object.entries(HEADER_ALIASES)) {
      if (aliases.some((a) => a.toLowerCase() === token) && map[field] == null) {
        map[field] = idx;
      }
    }
  });
  return map.name != null ? map : null;
}

function parseStudentsText(text) {
  const lines = String(text || "").split(/\r?\n/).filter((l) => l.trim());
  if (!lines.length) return [];

  const delim = sniffDelimiter(lines[0]);
  let rows = lines.map((l) => parseCsvLine(l, delim))
                  .filter((r) => r.some((c) => c.trim()));
  if (!rows.length) return [];

  let mapping = mapHeader(rows[0]);
  let body;
  if (mapping) {
    body = rows.slice(1);
  } else {
    body = rows;
    const firstCol = body.map((r) => (r[0] || "").trim()).filter(Boolean);
    const looksLikeId = firstCol.length > 0 &&
      firstCol.every((c) => /^\d{6,}$/.test(c));
    mapping = looksLikeId ? { sid: 0, name: 1, cls: 2 } : { name: 0, sid: 1, cls: 2 };
  }

  const cell = (row, field) => {
    const i = mapping[field];
    if (i == null || i >= row.length) return "";
    return String(row[i]).trim().replace(/^"|"$/g, "");
  };

  const out = [];
  for (const row of body) {
    if (!row) continue;
    let name, sid, cls;
    if (row.length === 1) {
      name = String(row[0]).trim().replace(NUMBERING, "").trim();
      sid = cls = "";
    } else {
      name = cell(row, "name");
      sid = cell(row, "sid");
      cls = cell(row, "cls");
    }
    if (!name) continue;
    out.push({ name, sid, cls });
  }
  return out;
}

function importText(text) {
  const parsed = parseStudentsText(text);
  const existing = new Set(DB.students.map((s) => `${s.name}\u0000${s.sid}\u0000${s.cls}`));
  const seenSid = new Map();
  const seenName = new Map();
  const warnings = [];
  let added = 0, skipped = 0;

  for (const item of parsed) {
    const key = `${item.name}\u0000${item.sid}\u0000${item.cls}`;
    if (existing.has(key)) { skipped++; continue; }
    addStudentRaw(item.name, item.sid, item.cls);
    existing.add(key);
    added++;

    if (item.sid) {
      if (seenSid.has(item.sid) && seenSid.get(item.sid) !== item.name) {
        warnings.push(`学号 ${item.sid} 对应多个姓名：${seenSid.get(item.sid)} / ${item.name}`);
      }
      seenSid.set(item.sid, item.name);
    }
    if (seenName.has(item.name) && item.sid && seenName.get(item.name) !== item.sid) {
      warnings.push(`姓名 ${item.name} 出现多个学号：${seenName.get(item.name)} / ${item.sid}`);
    }
    seenName.set(item.name, item.sid);
  }

  save();
  return { parsed: parsed.length, added, skipped, warnings: warnings.slice(0, 20) };
}

/* ---------------------------------------------------------- xlsx 解析
   .xlsx 本质是一个 ZIP 包，里面是 XML。不引第三方库（要保持单文件离线可用），
   用浏览器原生的 DecompressionStream 解压、DOMParser 解析。

   支持的单元格类型：
     t="s"          共享字符串表下标（Excel 默认）
     t="inlineStr"  内联字符串
     t="str"        公式结果字符串
     无 t           数字（学号往往是这种，需还原成整数文本）
   不支持：旧版 .xls 二进制格式、加密文件。
   ================================================================ */

const XML_DECODER = new TextDecoder("utf-8");

/** 原始 deflate 数据解压。 */
async function inflateRaw(bytes) {
  if (typeof DecompressionStream === "undefined") {
    throw new Error("当前浏览器不支持解压，请改用 CSV，或用桌面版导入 Excel");
  }
  const stream = new Blob([bytes]).stream()
    .pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/** 读取 ZIP 的中央目录，返回 {文件名: {method, compSize, localOff}}。 */
function readZipEntries(buf) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);

  // 从尾部往前找 EOCD（结尾记录），可能带注释，故最多回看 65557 字节
  let eocd = -1;
  const floor = Math.max(0, u8.length - 65557);
  for (let i = u8.length - 22; i >= floor; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("不是有效的 xlsx 文件（找不到 ZIP 结尾记录）");

  const count = dv.getUint16(eocd + 10, true);
  if (count === 0xffff) throw new Error("xlsx 使用了 ZIP64 格式，暂不支持");
  let p = dv.getUint32(eocd + 16, true);

  const entries = {};
  for (let n = 0; n < count; n++) {
    if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = XML_DECODER.decode(u8.subarray(p + 46, p + 46 + nameLen));
    entries[name] = { method, compSize, localOff };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

/** 取出 ZIP 中某个条目解压后的字节。 */
async function zipRead(buf, entry) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  const off = entry.localOff;
  if (dv.getUint32(off, true) !== 0x04034b50) throw new Error("xlsx 内部结构损坏");
  const nameLen = dv.getUint16(off + 26, true);
  const extraLen = dv.getUint16(off + 28, true);
  const start = off + 30 + nameLen + extraLen;
  const data = u8.subarray(start, start + entry.compSize);
  if (entry.method === 0) return data;            // 未压缩
  if (entry.method === 8) return await inflateRaw(data);
  throw new Error("xlsx 使用了不支持的压缩方式：" + entry.method);
}

/** "B12" -> 1（0 基列号）。单元格引用里的行号部分忽略。 */
function colIndex(ref) {
  let n = 0, seen = false;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c >= 65 && c <= 90) { n = n * 26 + (c - 64); seen = true; }
    else if (c >= 97 && c <= 122) { n = n * 26 + (c - 96); seen = true; }
    else break;
  }
  return seen ? n - 1 : -1;
}

/** 数字单元格规整：2.024240101E9 / 2024240101.0 都要还原成 2024240101。 */
function normalizeNumber(s) {
  if (!s) return "";
  if (/^-?\d+$/.test(s)) return s;
  if (!/^-?[\d.]+([eE][+-]?\d+)?$/.test(s)) return s;
  const n = Number(s);
  return Number.isFinite(n) && Number.isInteger(n) ? String(n) : s;
}

/** 收集元素内所有 <t> 文本，跳过日文注音 <rPh>。 */
function collectText(el) {
  let out = "";
  const list = el.getElementsByTagName("t");
  for (const t of list) {
    if (t.parentNode && t.parentNode.nodeName === "rPh") continue;
    out += t.textContent;
  }
  return out;
}

function parseSharedStrings(xml) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const out = [];
  for (const si of doc.getElementsByTagName("si")) out.push(collectText(si));
  return out;
}

function parseSheetXml(xml, shared) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const err = doc.getElementsByTagName("parsererror");
  if (err.length) throw new Error("xlsx 内部 XML 解析失败");

  const rows = [];
  for (const rowEl of doc.getElementsByTagName("row")) {
    const cells = [];
    for (const c of rowEl.getElementsByTagName("c")) {
      let idx = colIndex(c.getAttribute("r") || "");
      if (idx < 0) idx = cells.length;           // 没写引用时按顺序放

      const type = c.getAttribute("t");
      let val;
      if (type === "s") {
        const v = c.getElementsByTagName("v")[0];
        const si = v ? parseInt(v.textContent, 10) : -1;
        val = (si >= 0 && shared[si] != null) ? shared[si] : "";
      } else if (type === "inlineStr") {
        val = collectText(c);
      } else {
        const v = c.getElementsByTagName("v")[0];
        const raw = v ? v.textContent : "";
        val = (type === "str") ? raw : normalizeNumber(raw);
      }

      while (cells.length < idx) cells.push("");   // 补齐稀疏的空列
      cells[idx] = val;
    }
    rows.push(cells);
  }
  return rows;
}

/** 单元格值没有 <v> 的公式单元格等情况统一成字符串。 */
function csvQuoteCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/** 二维表转 CSV 文本，并跳过表头之前的标题行（与 Python 版逻辑一致）。 */
function rowsToText(rows) {
  const cleaned = rows
    .map((r) => (r || []).map((c) => String(c == null ? "" : c).trim()))
    .filter((r) => r.some((c) => c));
  if (!cleaned.length) return "";

  let start = 0, found = false;
  const limit = Math.min(10, cleaned.length);
  for (let i = 0; i < limit; i++) {
    if (mapHeader(cleaned[i])) { start = i; found = true; break; }
  }
  if (!found) {
    // 没有可识别表头时，跳过只有一格的标题行
    for (let i = 0; i < limit; i++) {
      if (cleaned[i].filter((c) => c).length >= 2) { start = i; break; }
    }
  }

  return cleaned.slice(start)
    .map((r) => r.map(csvQuoteCell).join(","))
    .join("\n");
}

/** 解析 xlsx，返回 {text, count}，多工作表时取解析出学生最多的那张。 */
async function parseXlsx(buf) {
  const entries = readZipEntries(buf);

  let shared = [];
  if (entries["xl/sharedStrings.xml"]) {
    shared = parseSharedStrings(
      XML_DECODER.decode(await zipRead(buf, entries["xl/sharedStrings.xml"]))
    );
  }

  const sheetNames = Object.keys(entries)
    .filter((n) => /^xl\/worksheets\/sheet\d*\.xml$/i.test(n));
  if (!sheetNames.length) throw new Error("Excel 里没有找到工作表");

  let best = null;
  for (const name of sheetNames) {
    const xml = XML_DECODER.decode(await zipRead(buf, entries[name]));
    const text = rowsToText(parseSheetXml(xml, shared));
    const count = parseStudentsText(text).length;
    if (!best || count > best.count) best = { text, count, name };
  }
  return best;
}

/* ---------------------------------------------------------- 导出 */

function exportCsvText(round) {
  const rows = history(round == null ? undefined : round);
  const q = (v) => {
    const s = String(v == null ? "" : v);
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const lines = ["序号,轮次,时间,姓名,学号,班级"];
  for (const r of rows) {
    lines.push([r.seq, r.round, r.drawnAt, r.name, r.sid, r.cls].map(q).join(","));
  }
  return "\ufeff" + lines.join("\r\n") + "\r\n";
}

function exportBackupText() {
  return JSON.stringify({
    app: "随机抽人",
    version: 1,
    exported_at: nowStr(),
    round: DB.round,
    students: listStudents(),
    draws: DB.draws.map((d) => ({
      student_id: d.studentId, seq: d.seq, round: d.round,
      drawn_at: d.drawnAt, name: d.name, sid: d.sid, cls: d.cls,
    })),
  }, null, 2);
}

function importBackupText(text) {
  const data = JSON.parse(text);
  const students = data.students || [];
  const draws = data.draws || [];
  if (!Array.isArray(students)) throw new Error("备份文件格式不正确");

  DB = emptyState();
  DB.round = parseInt(data.round, 10) || 1;
  for (const s of students) {
    DB.students.push({
      id: DB.nextStudentId++,
      name: String(s.name || ""),
      sid: String(s.sid || ""),
      cls: String(s.cls || ""),
      enabled: s.enabled === undefined ? true : !!Number(s.enabled),
      drawn: !!Number(s.drawn),
      drawnAt: s.drawn_at || null,
      createdAt: s.created_at || nowStr(),
    });
  }
  for (const d of draws) {
    DB.draws.push({
      id: DB.nextDrawId++,
      studentId: d.student_id == null ? null : Number(d.student_id),
      seq: Number(d.seq) || 0,
      round: Number(d.round) || 1,
      drawnAt: d.drawn_at || "",
      name: d.name || "",
      sid: d.sid || "",
      cls: d.cls || "",
    });
  }
  save();
  return { students: DB.students.length, draws: DB.draws.length };
}

/* ---------------------------------------------------------- 文件读写 */

function download(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || "text/csv") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function pickFile(accept) {
  return new Promise((resolve) => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = accept;
    inp.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(inp);
    let settled = false;
    const finish = (file) => {
      if (settled) return;
      settled = true;
      inp.remove();
      resolve(file || null);
    };
    inp.onchange = () => finish(inp.files && inp.files[0]);
    // 用户点「取消」时不会触发 change，靠窗口重新获得焦点来判断
    window.addEventListener("focus", () => setTimeout(() => finish(null), 500), { once: true });
    inp.click();
  });
}

const EMPTY_IMPORT = { parsed: 0, added: 0, skipped: 0, warnings: [] };

async function importFile() {
  const file = await pickFile(".csv,.txt,.xlsx,.xls");
  if (!file) return { cancelled: true };

  const name = file.name || "";
  const isXlsx = /\.xlsx$/i.test(name);

  try {
    if (/\.xls$/i.test(name)) {
      return Object.assign({}, EMPTY_IMPORT, {
        error: "不支持旧版 .xls 格式。请在 Excel 里「另存为」选择 .xlsx 或 CSV 后重试。",
      });
    }

    const bytes = await file.arrayBuffer();
    const text = isXlsx ? (await parseXlsx(bytes)).text : decodeBytes(bytes);

    const result = importText(text);
    result.source = name;
    if (result.parsed === 0) {
      result.error = isXlsx
        ? "这个 Excel 里没解析出学生，请确认有「姓名」这一列（首行是标题也能自动跳过）"
        : "这个文件里没解析出学生，请检查表头或内容";
    }
    return result;
  } catch (e) {
    return Object.assign({}, EMPTY_IMPORT, {
      error: `读取文件失败：${(e && e.message) || e}`,
    });
  }
}

/* ---------------------------------------------------------- 调度 */

const HANDLERS = {
  state: () => {
    seedIfNeeded();
    return {
      stats: stats(),
      students: listStudents(),
      history: history(),
      rounds: allRounds(),
      poolNames: poolNames(),
      dataDir: store.persistent ? "浏览器本地存储" : "内存（关闭页面后不保存）",
    };
  },
  draw: () => { seedIfNeeded(); return draw(); },
  undo: (id) => undo(id),
  reset_round: () => resetRound(),
  add_student: (name, sid, cls) => addStudent(name, sid, cls),
  update_student: (id, field, value) => updateStudent(id, field, value),
  set_enabled: (id, enabled) => setEnabled(id, enabled),
  delete_student: (id) => deleteStudent(id),
  clear_students: () => clearStudents(),
  import_text: (text) => importText(text),
  import_file: () => importFile(),
  export_csv: (round) => {
    download(`抽取记录_第${DB.round}轮.csv`, exportCsvText(round == null ? undefined : round));
    return { path: "已保存到浏览器的下载目录" };
  },
  export_backup: () => {
    download("随机抽人_备份.json", exportBackupText(), "application/json");
    return { path: "已保存到浏览器的下载目录" };
  },
  import_backup: async () => {
    const file = await pickFile(".json");
    if (!file) return { cancelled: true };
    try {
      const result = importBackupText(await file.text());
      result.path = file.name;
      return result;
    } catch (e) {
      return { error: `备份文件无法读取：${e}` };
    }
  },
};

async function call(method, ...args) {
  seedIfNeeded();
  const fn = HANDLERS[method];
  if (!fn) throw new Error(`未知接口 ${method}`);
  return await fn(...args);
}


const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------------- 状态 */
const S = {
  stats: { total: 0, remaining: 0, drawn: 0, disabled: 0, round: 1 },
  students: [],
  history: [],
  rounds: [],
  poolNames: [],
  viewRound: null,
  stageName: null,   // 当前大屏显示的名字
  busy: false,
};

let soundOn = false;

/* ---------------------------------------------------------- 提示 */
function toast(msg, kind = "info", ms = 3200) {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .3s";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 320);
  }, ms);
}

/* 自建确认框：pywebview 下原生 confirm 不可靠 */
function ask(title, text, okText = "确定") {
  return new Promise((resolve) => {
    $("modal-title").textContent = title;
    $("modal-text").textContent = text;
    $("modal-input").hidden = true;
    $("modal-ok").textContent = okText;
    $("modal-ok").className = "primary";
    $("modal").hidden = false;

    const done = (val) => {
      $("modal").hidden = true;
      $("modal-ok").onclick = null;
      $("modal-cancel").onclick = null;
      resolve(val);
    };
    $("modal-ok").onclick = () => done(true);
    $("modal-cancel").onclick = () => done(false);
  });
}

function askText(title, text, placeholder = "") {
  return new Promise((resolve) => {
    $("modal-title").textContent = title;
    $("modal-text").textContent = text;
    const ta = $("modal-input");
    ta.hidden = false;
    ta.value = "";
    ta.placeholder = placeholder;
    $("modal-ok").textContent = "导入";
    $("modal-ok").className = "primary";
    $("modal").hidden = false;
    ta.focus();

    const done = (val) => {
      $("modal").hidden = true;
      $("modal-ok").onclick = null;
      $("modal-cancel").onclick = null;
      resolve(val);
    };
    $("modal-ok").onclick = () => done(ta.value);
    $("modal-cancel").onclick = () => done(null);
  });
}

/* ---------------------------------------------------------- 音效 */
let audioCtx = null;
function beep() {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.exponentialRampToValueAtTime(1320, t + 0.11);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.36);
  } catch (e) { /* 音频不可用时静默忽略，不影响抽取 */ }
}

/* ================================================================
   刷新与渲染
   ================================================================ */
async function refresh() {
  const data = await call("state");
  S.stats = data.stats;
  S.students = data.students;
  S.history = data.history;
  S.rounds = data.rounds;
  S.poolNames = data.poolNames;
  if (S.viewRound === null) S.viewRound = S.stats.round;

  renderStats();
  renderHistory();
  renderRoster();
  renderDrawButton();
}

function renderStats() {
  $("c-remaining").textContent = S.stats.remaining;
  $("c-total").textContent = S.stats.total;
  $("c-round").textContent = S.stats.round;
  const pct = S.stats.total ? (S.stats.drawn / S.stats.total) * 100 : 0;
  $("c-progress").style.width = pct + "%";
}

function renderDrawButton() {
  const btn = $("btn-draw");
  if (S.busy) {
    btn.disabled = true;
    return;
  }
  if (S.stats.total === 0) {
    btn.disabled = true;
    btn.textContent = "请先导入名单";
    $("hint").textContent = "还没有名单，请到「名单管理」导入";
    return;
  }
  if (S.stats.remaining === 0) {
    btn.disabled = true;
    btn.textContent = "本 轮 已 抽 完";
    $("hint").textContent = "所有人都抽过了，点「重置本轮」开始新一轮";
    return;
  }
  btn.disabled = false;
  btn.textContent = "开 始 抽 取";
  $("hint").textContent = "按 空格 或 回车 也可以抽取";
}

function renderHistory() {
  const sel = $("round-select");
  const list = S.rounds.slice();
  if (!list.includes(S.stats.round)) list.unshift(S.stats.round);
  sel.innerHTML = list
    .map((r) => `<option value="${r}"${r === S.viewRound ? " selected" : ""}>第 ${r} 轮</option>`)
    .join("");

  const items = S.history.filter((h) => h.round === S.viewRound);
  const isCurrent = S.viewRound === S.stats.round;
  const box = $("history-list");

  if (!items.length) {
    box.innerHTML = `<div class="empty-note">这一轮还没有抽取记录<br>点「开始抽取」试试</div>`;
    return;
  }

  // 本轮内最后一次抽取高亮
  const newestSeq = Math.max(...items.map((h) => h.seq));
  box.innerHTML = items
    .map((h) => {
      const sub = [h.sid, h.cls].filter(Boolean).join(" · ") || "&nbsp;";
      const canUndo = isCurrent;
      return `<li class="hitem${isCurrent && h.seq === newestSeq ? " newest" : ""}">
        <span class="hseq">${h.seq}</span>
        <span class="hmain">
          <div class="hname">${esc(h.name)}</div>
          <div class="hsub">${esc(sub)}<span style="opacity:.6"> · ${esc(h.drawn_at.slice(11))}</span></div>
        </span>
        <button class="tiny ghost" data-undo="${h.id}"
          ${canUndo ? "" : 'disabled title="只能撤回当前轮次的记录"'}>撤回</button>
      </li>`;
    })
    .join("");
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

const rosterFiltered = () => {
  const q = $("roster-search").value.trim().toLowerCase();
  if (!q) return S.students;
  return S.students.filter((s) =>
    [s.name, s.sid, s.cls].some((v) => (v || "").toLowerCase().includes(q))
  );
};

function renderRoster() {
  const rows = rosterFiltered();
  $("roster-count").textContent =
    rows.length === S.students.length
      ? `共 ${S.students.length} 人`
      : `筛选出 ${rows.length} / ${S.students.length} 人`;

  $("roster-body").innerHTML = rows
    .map((s, i) => {
      const status = !s.enabled
        ? '<span class="pill off">已停用</span>'
        : s.drawn
        ? '<span class="pill drawn">已抽出</span>'
        : '<span class="pill pool">在池中</span>';
      return `<tr data-sid="${s.id}">
        <td class="dim" style="font-variant-numeric:tabular-nums">${i + 1}</td>
        <td><input type="text" data-field="name" value="${esc(s.name)}"></td>
        <td><input type="text" data-field="sid" value="${esc(s.sid)}"></td>
        <td><input type="text" data-field="cls" value="${esc(s.cls)}"></td>
        <td>${status}</td>
        <td>
          <div class="row-ops">
            <button class="tiny ghost" data-toggle="${s.id}" data-enabled="${s.enabled ? 0 : 1}">
              ${s.enabled ? "停用" : "启用"}
            </button>
            <button class="tiny danger ghost" data-del="${s.id}">删除</button>
          </div>
        </td>
      </tr>`;
    })
    .join("");
}

/* ================================================================
   抽取
   ================================================================ */
function setStage(name, meta, cls) {
  const el = $("display-name");
  el.className = "name " + (cls || "");
  el.textContent = name;
  $("display-meta").textContent = meta || "";
}

/** 滚动动画。抽取结果此时已经落库，动画只负责揭晓。 */
function rollAnimation() {
  return new Promise((resolve) => {
    const el = $("display-name");
    el.className = "name rolling";
    $("display-meta").textContent = "";
    const names = S.poolNames.length ? S.poolNames : ["—"];
    const total = 1150;
    const start = performance.now();

    (function tick() {
      const elapsed = performance.now() - start;
      if (elapsed >= total) { resolve(); return; }
      el.textContent = names[Math.floor(Math.random() * names.length)];
      const p = elapsed / total;
      setTimeout(tick, 38 + 210 * p * p);   // 越接近结束越慢
    })();
  });
}

async function doDraw() {
  if (S.busy) return;
  if (!S.stats.remaining) { toast("所有人都抽完了，请先重置本轮", "warn"); return; }

  S.busy = true;
  renderDrawButton();
  try {
    const result = await call("draw");
    if (!result) {
      await refresh();
      toast("没有可抽取的学生了", "warn");
      return;
    }

    await rollAnimation();

    const meta = [result.sid, result.cls].filter(Boolean).join("　·　");
    setStage(result.name, meta, "revealed");
    S.stageName = result.name;
    beep();

    await refresh();
    toast(`抽中 ${result.name}，已从抽取池移出，剩余 ${result.remaining} 人`, "ok", 2600);
  } catch (e) {
    toast("抽取出错：" + e, "err", 6000);
  } finally {
    S.busy = false;
    renderDrawButton();
  }
}

/* ================================================================
   操作
   ================================================================ */
async function doUndo(drawId) {
  if (S.busy) return;
  S.busy = true;
  try {
    const r = await call("undo", drawId);
    await refresh();
    if (S.stageName === r.name) {
      setStage("准备就绪", "", "idle");
      S.stageName = null;
    }
    toast(
      r.restored ? `已撤回 ${r.name}，放回抽取池` : `已删除记录，但 ${r.name} 已不在名单中`,
      r.restored ? "ok" : "warn"
    );
  } catch (e) {
    toast("撤回失败：" + e, "err");
  } finally {
    S.busy = false;
    renderDrawButton();
  }
}

async function doReset() {
  if (S.busy) return;
  const ok = await ask(
    "重置本轮",
    `所有学生将回到抽取池，当前第 ${S.stats.round} 轮的抽取记录会保留，轮次变为第 ${S.stats.round + 1} 轮。确定继续？`,
    "重置"
  );
  if (!ok) return;
  S.busy = true;
  try {
    const r = await call("reset_round");
    S.viewRound = r.new_round;
    S.stageName = null;
    setStage("准备就绪", "", "idle");
    await refresh();
    toast(`已重置，${r.restored} 人回到抽取池，现在是第 ${r.new_round} 轮`, "ok");
  } catch (e) {
    toast("重置失败：" + e, "err");
  } finally {
    S.busy = false;
    renderDrawButton();
  }
}

async function doExport() {
  try {
    const r = await call("export_csv", S.viewRound);
    if (r && r.cancelled) return;
    toast(r && r.path ? `已导出：${r.path}` : "已导出抽取记录", "ok", 5200);
  } catch (e) {
    toast("导出失败：" + e, "err", 6000);
  }
}

async function importFromFile() {
  try {
    const r = await call("import_file");
    if (!r || r.cancelled) return;
    if (r.error) { toast(r.error, "err", 7000); return; }
    reportImport(r);
    await refresh();
  } catch (e) {
    toast("导入失败：" + e, "err", 7000);
  }
}

function reportImport(r) {
  let msg = `已导入 ${r.added} 人`;
  if (r.skipped) msg += `，跳过重复 ${r.skipped} 条`;
  toast(msg, r.added ? "ok" : "warn", 5000);
  (r.warnings || []).forEach((w) => toast("提示：" + w, "warn", 9000));
  if (r.parsed === 0) toast("文件里没解析出任何学生，请检查表头或列的内容", "err", 8000);
}

(async function boot() {
  /* 工具栏 */
  $("btn-draw").onclick = doDraw;
  $("btn-reset").onclick = doReset;
  $("btn-export").onclick = doExport;
  $("chk-sound").onchange = (e) => { soundOn = e.target.checked; if (soundOn) beep(); };

  /* 抽取历史：撤回 */
  $("history-list").addEventListener("click", (e) => {
    const id = e.target.getAttribute && e.target.getAttribute("data-undo");
    if (id) doUndo(Number(id));
  });
  $("round-select").onchange = (e) => {
    S.viewRound = Number(e.target.value);
    renderHistory();
  };

  /* 视图切换 */
  document.querySelectorAll(".tabs button").forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
      const v = b.dataset.view;
      $("view-draw").hidden = v !== "draw";
      $("view-roster").hidden = v !== "roster";
    };
  });

  /* 名单：搜索与行内编辑 */
  $("roster-search").oninput = renderRoster;

  $("roster-body").addEventListener("change", async (e) => {
    const input = e.target;
    if (input.tagName !== "INPUT") return;
    const tr = input.closest("tr");
    const id = Number(tr.dataset.sid);
    const field = input.dataset.field;
    const student = S.students.find((s) => s.id === id);
    if (!student || student[field] === input.value) return;
    if (field === "name" && !input.value.trim()) {
      toast("姓名不能为空", "err");
      input.value = student.name;
      return;
    }
    try {
      await call("update_student", id, field, input.value);
      await refresh();
      toast("已保存", "ok", 1400);
    } catch (err) {
      toast("保存失败：" + err, "err");
      await refresh();
    }
  });

  /* 名单：停用 / 删除 */
  $("roster-body").addEventListener("click", async (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const tgl = btn.getAttribute("data-toggle");
    const del = btn.getAttribute("data-del");

    if (tgl) {
      const id = Number(tgl);
      const enable = btn.getAttribute("data-enabled") === "1";
      await call("set_enabled", id, enable);
      await refresh();
      toast(enable ? "已启用，回到抽取池" : "已停用，不参与抽取", "ok", 2200);
    }

    if (del) {
      const id = Number(del);
      const s = S.students.find((x) => x.id === id);
      if (!s) return;
      const ok = await ask(
        "永久删除学生",
        `确定把「${s.name}」从名单中彻底删除吗？\n\n已有的抽取记录会保留，但此操作无法撤销。`,
        "删除"
      );
      if (ok) {
        await call("delete_student", id);
        await refresh();
        toast(`已删除 ${s.name}`, "ok");
      }
    }
  });

  /* 名单：新增 */
  $("btn-add").onclick = async () => {
    const text = await askText("新增学生", "按「姓名,学号,班级」输入，学号和班级可省略。", "张三,2024240101,计算机2401");
    if (text === null) return;
    if (!text.trim()) return;
    const r = await call("import_text", text);
    reportImport(r);
    await refresh();
  };

  /* 名单：导入 */
  $("btn-import-file").onclick = importFromFile;
  $("btn-import-paste").onclick = async () => {
    const text = await askText(
      "粘贴文本导入",
      "每行一个学生，支持「姓名,学号,班级」，也支持只粘姓名。",
      "张三,2024240101,计算机2401\n李四,2024240102,计算机2401"
    );
    if (text === null || !text.trim()) return;
    const r = await call("import_text", text);
    reportImport(r);
    await refresh();
  };

  /* 备份 */
  $("btn-backup-out").onclick = async () => {
    const r = await call("export_backup");
    if (r && r.cancelled) return;
    toast(r && r.path ? `备份已保存：${r.path}` : "备份已导出", "ok", 5200);
  };
  $("btn-backup-in").onclick = async () => {
    const ok = await ask("导入备份", "导入备份会覆盖当前全部名单和抽取记录。确定继续？", "覆盖导入");
    if (!ok) return;
    const r = await call("import_backup");
    if (!r || r.cancelled) return;
    if (r.error) { toast(r.error, "err", 7000); return; }
    S.viewRound = null;
    S.stageName = null;
    setStage("准备就绪", "", "idle");
    await refresh();
    toast(`备份已恢复：${r.students} 名学生，${r.draws} 条记录`, "ok", 5000);
  };

  /* 清空名单 */
  $("btn-clear").onclick = async () => {
    const ok = await ask("清空名单", "将删除全部学生。抽取历史会保留。确定继续？", "清空");
    if (!ok) return;
    const r = await call("clear_students");
    S.stageName = null;
    setStage("准备就绪", "", "idle");
    await refresh();
    toast(`已清空 ${r.deleted} 名学生`, "ok");
  };

  /* 键盘快捷键 */
  document.addEventListener("keydown", (e) => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (e.code === "Space" || e.code === "Enter" || e.key === " ") {
      if ($("view-draw").hidden) return;
      e.preventDefault();
      if (!$("modal").hidden) return;
      doDraw();
    }
  });

  /* 初始化：必须等 JS 桥就绪，否则首次 refresh 会因为桥还没注入而失败 */
  try {
    await resolveShell();
    await refresh();
    setStage(S.stats.total ? "准备就绪" : "等待导入名单", "", "idle");
  } catch (e) {
    setStage("无法连接后端", "", "idle");
    $("hint").textContent = "请关闭程序后重新打开";
    toast("初始化失败：" + (e && e.message ? e.message : e), "err", 12000);
    console.error(e);
  }
})();
</script>

setTimeout(function(){
  var pre=document.createElement('pre'); pre.id='STORE';

  pre.textContent=JSON.stringify({file:'另一个文件夹/副本.html', history:((st.draws)||[]).length, students:((st.students)||[]).length, lastName:((st.draws||[]).slice(-1)[0]||{}).name});
  document.body.appendChild(pre);
},1500);
</script></body>
